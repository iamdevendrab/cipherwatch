apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cipherwatch-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iamdevendrab/cipherwatch.git
    targetRevision: main
    path: k8s-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
