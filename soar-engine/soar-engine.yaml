apiVersion: v1
kind: ServiceAccount
metadata:
  name: soar-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: soar-engine-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: soar-engine-binding
subjects:
  - kind: ServiceAccount
    name: soar-engine
    namespace: security
roleRef:
  kind: ClusterRole
  name: soar-engine-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soar-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soar-engine
  template:
    metadata:
      labels:
        app: soar-engine
    spec:
      serviceAccountName: soar-engine
      containers:
        - name: soar-engine
          image: iamddb/soar-engine:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: soar-engine
spec:
  selector:
    app: soar-engine
  ports:
    - port: 8080
      targetPort: 8080
